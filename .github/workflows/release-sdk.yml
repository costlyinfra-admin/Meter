name: Release SDK

# Publishes the metering SDKs on a version tag:
#   git tag sdk-v1.0.0 && git push origin sdk-v1.0.0
#
# PyPI uses TRUSTED PUBLISHING (OpenID Connect) — no API token is stored
# anywhere. One-time human setup (see docs/deploy.md):
#   1. Create a PyPI account (2FA is mandatory) and, under Account -> Publishing,
#      add a *pending* GitHub Actions publisher:
#        project = costlyinfra-meter, owner = costlyinfra-admin,
#        repo = Meter, workflow = release-sdk.yml, environment = pypi
#   2. Create a GitHub Environment named `pypi` (repo Settings -> Environments).
#   The name is CLAIMED on the first successful publish — it can't be reserved.
#
# npm currently uses a token (npm trusted publishing can replace it later):
#   3. Add repo secret NPM_TOKEN — a granular access token (npm removed the
#      classic Automation/Publish tokens in November 2025). A granular token
#      cannot be scoped to a package that does not exist yet, so the FIRST
#      publish of a new name needs "All packages / Read and write"; narrow it to
#      the package afterwards. The package is unscoped, so no npm org is needed.
#      Without the token the Node job just tests and skips publishing.
#      npm trusted publishing (OIDC) can replace the token entirely — the job
#      already requests id-token: write for provenance.

on:
  push:
    tags: ["sdk-v*"]
  workflow_dispatch: {}

jobs:
  # A gate, not a formality. The agent-run rewrite replaced the SDK's entire
  # public API and left both manifests at 1.0.0 — the version already on PyPI
  # and npm — so the registries served the old API while the repo, the docs and
  # the Install SDK page all described the new one. Nothing failed, because the
  # only version assertion anywhere was a ">= MIN_SDK" floor check.
  #
  # These three checks would each have caught it on its own.
  guard:
    name: Version guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The two SDKs agree, and the tag matches them
        run: |
          set -euo pipefail
          PY_V=$(grep -m1 '^version = ' sdk/python/pyproject.toml | cut -d'"' -f2)
          NODE_V=$(node -p "require('./sdk/node/package.json').version")
          PY_DUNDER=$(grep -m1 '^__version__ = ' sdk/python/costlyinfra_meter/__init__.py | cut -d'"' -f2)
          NODE_CONST=$(grep -m1 '^export const VERSION = ' sdk/node/index.mjs | cut -d'"' -f2)
          echo "pyproject=$PY_V node=$NODE_V __version__=$PY_DUNDER VERSION=$NODE_CONST"

          # The two SDKs release together, and each one's runtime constant is
          # what a customer sees in a bug report — all four must be one number.
          for v in "$NODE_V" "$PY_DUNDER" "$NODE_CONST"; do
            [ "$v" = "$PY_V" ] || { echo "::error::version mismatch: expected $PY_V, found $v"; exit 1; }
          done

          # A tag that says one thing while the manifests say another publishes
          # the manifest's number, silently ignoring the tag.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG_V="${GITHUB_REF_NAME#sdk-v}"
            [ "$TAG_V" = "$PY_V" ] || { echo "::error::tag $GITHUB_REF_NAME does not match manifest $PY_V"; exit 1; }
          fi

      - name: This version is not already published
        run: |
          set -euo pipefail
          V=$(grep -m1 '^version = ' sdk/python/pyproject.toml | cut -d'"' -f2)
          # Re-publishing a number is what put an old API behind 1.0.0. Both
          # registries refuse it anyway; failing here says why, before a
          # half-published release leaves PyPI and npm on different APIs.
          if curl -sf "https://pypi.org/pypi/costlyinfra-meter/$V/json" >/dev/null; then
            echo "::error::costlyinfra-meter $V is already on PyPI — bump the version"; exit 1
          fi
          if curl -sf "https://registry.npmjs.org/costlyinfra-meter/$V" >/dev/null; then
            echo "::error::costlyinfra-meter $V is already on npm — bump the version"; exit 1
          fi
          echo "$V is unpublished on both registries."

  python:
    needs: guard
    name: Publish Python SDK (PyPI trusted publishing)
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC — lets PyPI verify this workflow; no token needed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test (the SDK must never ship broken)
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pytest -q

      - name: Build
        working-directory: sdk/python
        run: |
          pip install --upgrade build twine
          python -m build
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist
          # This job publishes to two registries that can fail independently —
          # a bad npm token takes out one and leaves the other done. Re-running
          # the release is then the only way forward, and it must not fail just
          # because PyPI already has the version. A forgotten version bump still
          # surfaces: npm rejects a duplicate publish outright.
          skip-existing: true

  node:
    needs: guard
    name: Publish Node SDK
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for npm provenance attestation
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Test
        working-directory: sdk/node
        run: node --test

      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        working-directory: sdk/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Skip note
        if: ${{ env.NPM_TOKEN == '' }}
        run: echo "NPM_TOKEN not set — tested, skipped publish."
