name: Release SDK

# Publishes the metering SDKs on a version tag:
#   git tag sdk-v1.0.0 && git push origin sdk-v1.0.0
#
# PyPI uses TRUSTED PUBLISHING (OpenID Connect) — no API token is stored
# anywhere. One-time human setup (see docs/deploy.md):
#   1. Create a PyPI account (2FA is mandatory) and, under Account -> Publishing,
#      add a *pending* GitHub Actions publisher:
#        project = costlyinfra-meter, owner = costlyinfra-admin,
#        repo = Meter, workflow = release-sdk.yml, environment = pypi
#   2. Create a GitHub Environment named `pypi` (repo Settings -> Environments).
#   The name is CLAIMED on the first successful publish — it can't be reserved.
#
# npm currently uses a token (npm trusted publishing can replace it later):
#   3. Add repo secret NPM_TOKEN — a granular access token (npm removed the
#      classic Automation/Publish tokens in November 2025). A granular token
#      cannot be scoped to a package that does not exist yet, so the FIRST
#      publish of a new name needs "All packages / Read and write"; narrow it to
#      the package afterwards. The package is unscoped, so no npm org is needed.
#      Without the token the Node job just tests and skips publishing.
#      npm trusted publishing (OIDC) can replace the token entirely — the job
#      already requests id-token: write for provenance.

on:
  push:
    tags: ["sdk-v*"]
  workflow_dispatch: {}

jobs:
  python:
    name: Publish Python SDK (PyPI trusted publishing)
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC — lets PyPI verify this workflow; no token needed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test (the SDK must never ship broken)
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pytest -q

      - name: Build
        working-directory: sdk/python
        run: |
          pip install --upgrade build twine
          python -m build
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist

  node:
    name: Publish Node SDK
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for npm provenance attestation
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Test
        working-directory: sdk/node
        run: node --test

      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        working-directory: sdk/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Skip note
        if: ${{ env.NPM_TOKEN == '' }}
        run: echo "NPM_TOKEN not set — tested, skipped publish."
