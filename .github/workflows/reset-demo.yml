name: Reset demo data

# One-click: wipes the demo "Acme Security" tenant (and ALL its data, via
# ON DELETE CASCADE) and rebuilds it fresh with the extended dataset — more
# features + ~2 years of monthly history. Run from the Actions tab ->
# "Reset demo data" -> Run workflow.
#
# Destructive but scoped: only the demo tenant matching DEMO_USER_EMAIL is
# touched; no other tenant is affected. Requires repo secret: DATABASE_URL.

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Demo login email"
        default: "demo@costlyinfra.com"
        required: true
      password:
        description: "Demo login password"
        default: "meter-demo"
        required: true

jobs:
  reset:
    name: Reset demo tenant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Postgres client (psql, for migrations)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Reset + seed
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEMO_USER_EMAIL: ${{ inputs.email }}
          DEMO_USER_PASSWORD: ${{ inputs.password }}
        run: python -m seed --reset
