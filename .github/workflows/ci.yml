name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Postgres (server binaries for ephemeral test DB)
        # Tests spin up a throwaway Postgres via pytest-postgresql; they need
        # initdb/pg_ctl present, not a running service.
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (pytest)
        run: pytest

  sdk:
    name: Metering SDKs (Python + Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python SDK
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          ruff check .
          pytest
      - name: Node SDK
        working-directory: sdk/node
        # The suite passes locally every time (42/42, ten runs in a row) and has
        # failed here repeatedly, on Node 20 and on 22, with no SDK change
        # between a pass and a fail. Job logs need admin rights, and the check
        # annotations carried only "exit code 1" — so the failure has never said
        # what it was. `::error::` lines become annotations, which are readable,
        # so the next failure names the assertion instead of hiding it.
        run: |
          set -o pipefail
          if node --test 2>&1 | tee /tmp/node-test.log; then
            exit 0
          fi
          echo "::error::Node SDK suite failed. Failing assertions follow."
          grep -E "^not ok|^ +(error|code|failureType|expected|actual):|✖" /tmp/node-test.log \
            | head -30 \
            | while IFS= read -r line; do echo "::error::${line}"; done
          exit 1

  web:
    name: Web (React + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Test (vitest)
        run: npm test
