[project]
name = "costlyinfra-meter"
version = "1.0.0"
description = "Meter — emit per-call LLM usage events for per-feature cost attribution."
readme = "README.md"
requires-python = ">=3.9"
# Apache-2.0 (permissive) so customers can embed the SDK in proprietary apps.
# The Meter server stays AGPL-3.0; only this client SDK is permissive.
license = { text = "Apache-2.0" }
authors = [{ name = "Costly Infra" }]
dependencies = []  # stdlib only — keep the customer's footprint tiny

[project.urls]
Homepage = "https://github.com/costlyinfra-admin/Meter"
Source = "https://github.com/costlyinfra-admin/Meter/tree/main/sdk/python"

[project.optional-dependencies]
# ruff is here because CI lints this package (`ruff check .` in the SDK job).
# Without it that step exits 127 — command not found — which is how the SDK
# job failed for weeks while the tests underneath it were passing.
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["costlyinfra_meter*"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["UP045"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
