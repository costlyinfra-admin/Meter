[project]
name = "meter-backend"
version = "0.1.0"
description = "Meter backend — connector ingest, attribution, reconciliation, and API layer."
requires-python = ">=3.9"
license = { text = "AGPL-3.0-or-later" }
# Runtime dependencies are added per-milestone. M1: Postgres. M2: API + auth.
# M3: GitHub connector (httpx) + Claude-backed feature discovery (anthropic).
dependencies = [
    "psycopg[binary]>=3.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "bcrypt>=4.1",
    "cryptography>=42.0",
    "itsdangerous>=2.1",
    "httpx>=0.27",
    "anthropic>=0.39",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pytest-postgresql>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["meter*"]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["meter", "tests"]

[tool.ruff.lint]
# Sensible default rule set: pyflakes (F), pycodestyle (E/W), isort (I), bugbear (B), pyupgrade (UP).
select = ["E", "W", "F", "I", "B", "UP"]
# We target Python 3.9 and run Pydantic, which cannot evaluate `X | None` unions
# at runtime there; keep using typing.Optional.
ignore = ["UP045"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
